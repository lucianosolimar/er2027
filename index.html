<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BI · Planejamento 2027 · ER São José do Rio Preto</title>
<style>
:root{
  color-scheme: light;
  --surface-0:#f4f6f9; --surface-1:#ffffff; --line:#e3e7ee; --grid:#eceff3;
  --text-primary:#191919; --text-secondary:#5f6670; --text-muted:#8a919b;
  --brand:#0B4F9C; --brand-2:#083a73;
  --series-1:#257de0; --series-2:#f47230; --series-3:#00b894; --series-4:#f2a600; --series-5:#ee7fac;
  --good:#0aac23; --warning:#fbb315; --serious:#f18a59; --critical:#dc3c3d; --neutral:#9aa1ab;
  --seq-100:#cce3fd; --seq-200:#9dc8f7; --seq-300:#6aabf1; --seq-400:#338ced; --seq-500:#2370cd; --seq-600:#1757ac; --seq-700:#0e3d7e;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,Helvetica,sans-serif;background:var(--surface-0);color:var(--text-primary);font-size:14px}
header{background:var(--brand);color:#fff;padding:14px 24px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
header h1{font-size:19px;margin:0;font-weight:700}
header .sub{font-size:12px;opacity:.85;margin-top:2px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.controls label{font-size:12px;opacity:.9}
select,button,.btn{font:inherit;font-size:13px;border-radius:6px;border:1px solid #c9d3e0;padding:6px 10px;background:#fff;color:var(--text-primary)}
.btn{cursor:pointer;background:#fff;color:var(--brand);font-weight:600;border-color:#fff}
.btn:hover{background:#eaf2fc}
nav{display:flex;gap:2px;padding:0 24px;background:var(--brand-2);overflow-x:auto}
nav button{background:transparent;border:0;border-bottom:3px solid transparent;color:#cfe0f5;border-radius:0;padding:10px 14px;cursor:pointer;white-space:nowrap;font-weight:600}
nav button.on{color:#fff;border-bottom-color:#f4a300}
main{padding:20px 24px 40px;max-width:1400px;margin:0 auto}
h2{font-size:17px;margin:4px 0 4px}
.lead{color:var(--text-secondary);margin:0 0 16px;font-size:13px}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 4px;font-size:15px}
.card .hint{color:var(--text-secondary);font-size:12px;margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface-1);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .v{font-size:28px;font-weight:700;line-height:1.1}
.kpi .l{color:var(--text-secondary);font-size:12px;margin-top:4px}
.kpi .s{color:var(--text-muted);font-size:11px;margin-top:2px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--grid);text-align:left;vertical-align:top}
th{font-size:11.5px;color:var(--text-secondary);font-weight:600;background:#f8f9fb;position:sticky;top:0}
td.c,th.c{text-align:center}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.clk{cursor:pointer} tr.clk:hover td{background:#f5f9ff}
.scroll{overflow:auto;max-height:620px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent;color:var(--text-primary)}
.chip i{font-style:normal;display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;color:#fff;font-size:9px;font-weight:700}
.st-ok{background:#e6f6e9}.st-ok i{background:var(--good)}
.st-parc{background:#fff4d6}.st-parc i{background:#c98a00}
.st-pend{background:#fde8e8}.st-pend i{background:var(--critical)}
.st-warn{background:#fff4d6}.st-warn i{background:#c98a00}
.st-crit{background:#fde8e8}.st-crit i{background:var(--critical)}
.st-ser{background:#fdeee6}.st-ser i{background:#d9652c}
.st-neu{background:#eef1f5}.st-neu i{background:var(--neutral)}
.bar{height:8px;background:var(--grid);border-radius:4px;overflow:hidden;min-width:80px}
.bar>span{display:block;height:100%;background:var(--series-1);border-radius:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:980px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin:6px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:3px;border-radius:2px}
.sw.dot{width:10px;height:10px;border-radius:50%}
svg text{font-family:inherit}
.axis text{fill:var(--text-secondary);font-size:11px}
#tip{position:fixed;pointer-events:none;background:#1f2430;color:#fff;font-size:12px;line-height:1.45;padding:8px 10px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:50;max-width:340px;display:none}
#tip b{font-weight:600}
.empty{color:var(--text-muted);font-style:italic;padding:12px 0}
.mcard{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface-1)}
.mcard .d{font-size:22px;font-weight:700}
.mcard .t{color:var(--text-secondary);font-size:12px}
.counts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.note{background:#fff8e5;border:1px solid #f6dfa0;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#5a4500;margin-bottom:16px}
.eval{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.eval h4{margin:12px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-secondary)}
.eval p{margin:0;font-size:13px;line-height:1.5}
footer{color:var(--text-muted);font-size:11.5px;text-align:center;padding:10px 0 30px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:#eef1f5;color:var(--text-secondary);margin-right:4px}
</style>
</head>

const MESES = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const nf = new Intl.NumberFormat('pt-BR',{maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
const pf = new Intl.NumberFormat('pt-BR',{style:'percent',maximumFractionDigits:1});
const TODAY = new Date(); TODAY.setHours(0,0,0,0);

/* ---------------- helpers ---------------- */
const esc = s => s==null ? '' : String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => (v===null||v===undefined||v===''||isNaN(+v)) ? null : +v;
const has = v => !(v===null||v===undefined||String(v).trim()==='');
const parseD = s => { if(!has(s)) return null; const [y,m,d]=String(s).slice(0,10).split('-').map(Number); return new Date(y,m-1,d); };
const fmtD = s => { const d=parseD(s); return d? d.toLocaleDateString('pt-BR') : '—'; };
const fmtMY = s => { const d=parseD(s); return d? MESES[d.getMonth()]+'/'+d.getFullYear() : '—'; };
const isPct = unit => unit==='%';
const fv = (v,unit) => v==null ? '—' : (isPct(unit) ? pf.format(v) : nf.format(v));
const byCel = rows => CEL==='Todas' ? rows : rows.filter(r => (r['Célula']||r['Célula de origem'])===CEL);
function chip(cls, icon, text, tip){ return `<span class="chip ${cls}"${tip?` data-tip="${esc(tip)}"`:''}><i>${icon}</i>${esc(text)}</span>`; }
const ST = {
  ok:['st-ok','✓','Completo'], parc:['st-parc','◐','Parcial'], pend:['st-pend','✕','Pendente'],
  'Atingido':['st-ok','✓','Atingido'], 'Atenção':['st-warn','!','Atenção'], 'Crítico':['st-crit','✕','Crítico'],
  'Sem realizado':['st-ser','?','Sem realizado'], 'Sem previsão':['st-ser','–','Sem previsão'], 'A vencer':['st-neu','○','A vencer']
};
const stChip = (k,tip) => { const s=ST[k]||['st-neu','•',k]; return chip(s[0],s[1],s[2],tip); };

/* ---------------- load ---------------- */
function prepare(raw){
  const d = JSON.parse(JSON.stringify(raw));
  d.celulas = d._celulas;
  d.ind = d._indicadores.map(([nome,unidade,agg])=>({nome,unidade,agg}));
  d.indMap = Object.fromEntries(d.ind.map(i=>[i.nome,i]));
  d.marcos = d._marcos.map(([nome,data],k)=>({nome,data:parseD(data),k:k+1}));
  d.mon = (d.Monitoramento_Mensal||[]).filter(r=>has(r['Célula'])&&has(r['Indicador oficial'])).map(r=>{
    const info = d.indMap[r['Indicador oficial']]||{unidade:'',agg:'Soma'};
    const prev = MESES.map(m=>num(r['Prev '+m])), real = MESES.map(m=>num(r['Real '+m]));
    return {cel:r['Célula'], ind:r['Indicador oficial'], unidade:info.unidade, agg:info.agg, meta:num(r['Meta anual (ref.)']), prev, real, obs:r['Observações / fonte do dado']};
  });
  return d;
}
function acum(arr, m, agg){ const v = arr.slice(0,m).filter(x=>x!=null); if(!v.length) return null; return agg==='Soma' ? v.reduce((a,b)=>a+b,0) : v[v.length-1]; }
function marcoStatus(p, r, date){
  if(p==null) return 'Sem previsão';
  if(TODAY <= date) return 'A vencer';
  if(r==null) return 'Sem realizado';
  if(r>=p) return 'Atingido';
  if(r>=0.9*p) return 'Atenção';
  return 'Crítico';
}
function marcosOf(row){
  return D.marcos.map(mk=>{ const m=mk.data.getMonth()+1; const p=acum(row.prev,m,row.agg), r=acum(row.real,m,row.agg);
    return {p, r, pct:(p&&r!=null)? r/p : null, st: marcoStatus(p,r,mk.data)}; });
}
const relevant = r => r.meta!=null || r.prev.some(x=>x!=null) || r.real.some(x=>x!=null);

const tip = document.getElementById('tip');
document.addEventListener('mousemove', e=>{
  const t = e.target.closest('[data-tip]');
  if(!t){ tip.style.display='none'; return; }
  tip.innerHTML = t.getAttribute('data-tip').replace(/\n/g,'<br>');
  tip.style.display='block';
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX+14, y = e.clientY+14;
  if(x+w>innerWidth-8) x = e.clientX-w-14;
  if(y+h>innerHeight-8) y = e.clientY-h-14;
  tip.style.left=x+'px'; tip.style.top=y+'px';
});

/* ---------------- charts ---------------- */
function niceMax(v){ if(!v||v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function lineChart({series, ref, markers, unit, height=300}){
  const W=860, H=height, ml=64, mr=24, mt=18, mb=34, iw=W-ml-mr, ih=H-mt-mb;
  const all = series.flatMap(s=>s.vals.filter(v=>v!=null)); if(ref&&ref.value!=null) all.push(ref.value);
  if(!all.length) return `<div class="empty">Sem dados mensais para exibir.</div>`;
  const ymax = niceMax(Math.max(...all)*1.08);
  const x = i => ml + iw*(i+0.5)/12, y = v => mt + ih - ih*v/ymax;
  let g = '';
  for(let k=0;k<=4;k++){ const v=ymax*k/4, yy=y(v);
    g += `<line x1="${ml}" x2="${W-mr}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/>`;
    g += `<text x="${ml-8}" y="${yy+4}" text-anchor="end" class="ax">${fv(v,unit)}</text>`; }
  MESES.forEach((m,i)=>{ g += `<text x="${x(i)}" y="${H-12}" text-anchor="middle" class="ax">${m}</text>`; });
  (markers||[]).forEach(mk=>{ const xx = ml + iw*(mk.m-1+(mk.frac||0.5))/12;
    g += `<line x1="${xx}" x2="${xx}" y1="${mt}" y2="${mt+ih}" stroke="#f4a300" stroke-dasharray="3 3" stroke-width="1.5"/>`;
    g += `<text x="${xx+4}" y="${mt+10}" font-size="11" fill="#9a6700" font-weight="600">${mk.label}</text>`; });
  if(ref && ref.value!=null){ const yy=y(ref.value);
    g += `<line x1="${ml}" x2="${W-mr}" y1="${yy}" y2="${yy}" stroke="var(--text-primary)" stroke-dasharray="6 4" stroke-width="1.5"/>`;
    g += `<rect x="${ml+4}" y="${yy-20}" width="${(ref.label.length+12)*6.6}" height="16" fill="var(--surface-1)" opacity=".85"/><text x="${ml+8}" y="${yy-7}" font-size="11.5" fill="var(--text-primary)" font-weight="600">${esc(ref.label)}: ${fv(ref.value,unit)}</text>`; }
  series.forEach(s=>{
    let d='', pen=false;
    s.vals.forEach((v,i)=>{ if(v==null){ if(!s.connect) pen=false; return; } d += (pen?'L':'M')+x(i)+' '+y(v)+' '; pen=true; });
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" ${s.dash?`stroke-dasharray="${s.dash}"`:''} stroke-linejoin="round" stroke-linecap="round"/>`;
    s.vals.forEach((v,i)=>{ if(v!=null) g += `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${s.color}" stroke="var(--surface-1)" stroke-width="2"/>`; });
    const li = s.vals.map((v,i)=>v!=null?i:-1).filter(i=>i>=0).pop();
    if(li!=null) g += `<text x="${Math.min(x(li)+8,W-mr-4)}" y="${y(s.vals[li])-8}" font-size="11.5" fill="var(--text-primary)" text-anchor="${li>9?'end':'start'}">${esc(s.name)}</text>`;
  });
  MESES.forEach((m,i)=>{ const lines = series.map(s=>`${esc(s.name)}: <b>${fv(s.vals[i],unit)}</b>`).join('\n');
    g += `<rect x="${ml+iw*i/12}" y="${mt}" width="${iw/12}" height="${ih}" fill="transparent" data-tip="<b>${m}</b>\n${lines}"/>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"><style>.ax{fill:var(--text-secondary);font-size:11px}</style>${g}</svg>`;
}
function legend(items){ return `<div class="legend">${items.map(i=>`<span><span class="sw ${i.dot?'dot':''}" style="background:${i.color};${i.dash?'background:repeating-linear-gradient(90deg,'+i.color+' 0 6px,transparent 6px 10px)':''}"></span>${esc(i.name)}</span>`).join('')}</div>`; }

const PAGES = [
  ['comp','Completude'], ['marcos','Marcos críticos'], ['mon','Monitoramento mensal'], ['metas','Metas × carteira'],

function completude(c){
  const proj = D.Carteira.filter(r=>r['Célula']===c);
  const share = f => proj.length ? proj.filter(r=>has(r[f])).length/proj.length : null;
  const s = v => v==null ? 'pend' : v>=1 ? 'ok' : v>0 ? 'parc' : 'pend';
  const any = b => b ? 'ok' : 'pend';
  const monR = D.mon.filter(r=>r.cel===c && r.meta!=null);
  const prevShare = monR.length ? monR.filter(r=>r.prev.some(x=>x!=null)).length/monR.length : null;
  const items = [
    ['Carteira', any(proj.length>0), `${proj.length} projeto(s)/ação(ões)`],
    ['Classificação', s(share('Classificação')), proj.length? `${Math.round(share('Classificação')*100)}% dos projetos classificados`:'Sem carteira'],
    ['Projeto especial', any(proj.some(r=>r['Classificação']==='Especial'||r['Elegível a Projeto Especial?']==='Sim')), ''],
    ['Metas', any(D.Metas.some(r=>r['Célula']===c) || monR.length>0), `${monR.length} indicador(es) oficial(is) com meta`],
    ['Previsão mensal', s(prevShare), monR.length? `${Math.round(prevShare*100)}% dos indicadores com meta têm previsão mensal`:'Sem meta registrada'],
    ['Data de lançamento', s(share('Data de lançamento')), ''],
    ['Parceiros', any(D.Parceiros.some(r=>r['Célula']===c)), `${D.Parceiros.filter(r=>r['Célula']===c).length} parceiro(s)`],
    ['Contrato B2B definido', s(share('Terá contrato B2B?')), ''],
    ['Captação de clientes', s(share('Como vai captar os clientes?')), ''],
    ['Método de faturamento', s(share('Método de acompanhamento do faturamento do cliente')), ''],
    ['Aprendizados / melhorias', any(D.Melhorias.some(r=>r['Célula']===c)), ''],
    ['Ações da jornada', any(D.Acoes_Jornada.some(r=>r['Célula']===c)), `${D.Acoes_Jornada.filter(r=>r['Célula']===c).length} ação(ões)`],
    ['Conexões', any(D.Conexoes.some(r=>r['Célula de origem']===c||r['Célula conectada']===c)), ''],
  ];
  const score = items.reduce((a,i)=>a+(i[1]==='ok'?1:i[1]==='parc'?0.5:0),0)/items.length;
  const started = proj.length>0 || D.Metas.some(r=>r['Célula']===c) || monR.length>0;
  return {items, score, started, nproj:proj.length};
}

function pageComp(){

    ${ms.map((m,k)=>`<td class="n">${fv(m.p,r.unidade)}</td><td class="n">${fv(m.r,r.unidade)}</td><td class="c">${stChip(m.st, `${D.marcos[k].nome}\nPrevisto acumulado: ${fv(m.p,r.unidade)}\nRealizado acumulado: ${fv(m.r,r.unidade)}${m.pct!=null?'\n'+pf.format(m.pct)+' do previsto':''}`)}</td>`).join('')}</tr>`; }).join('');
  const cels = CEL==='Todas' ? D.celulas : [CEL];
  const cov = cels.map(c=>`<tr><td>${esc(c)}</td>${D.ind.map(i=>{ const r=D.mon.find(x=>x.cel===c&&x.ind===i.nome);
      const k = !r||r.meta==null ? 'pend' : r.prev.some(x=>x!=null) ? 'ok' : 'parc';

  return `<h2>Marcos críticos de 2027</h2>
  <p class="lead">Previsto × realizado acumulado até cada marco, por célula e indicador oficial. Indicadores em % usam o último valor informado até o marco. Status: Atingido · Atenção (≥ 90% do previsto) · Crítico (&lt; 90%) · Sem realizado · Sem previsão · A vencer.</p>
  <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${cards}</div>
  <div class="card"><h3>Indicadores com meta, por marco</h3><p class="hint">Só aparecem os indicadores com meta ou valores lançados.</p>
  ${rel.length? `<div class="scroll"><table><thead><tr><th rowspan="2">Célula</th><th rowspan="2">Indicador</th><th rowspan="2" class="n">Meta anual</th>${D.marcos.map(m=>`<th colspan="3" class="c" style="border-left:2px solid #f4a300">${esc(m.nome)} · ${m.data.toLocaleDateString('pt-BR')}</th>`).join('')}</tr>

}

function pageMon(){
  const rows = D.mon.filter(r=>CEL==='Todas'||r.cel===CEL);
  let opts = rows.filter(relevant); if(!opts.length) opts = rows;
  if(!opts.length) return '<div class="empty">Sem dados.</div>';
  let cur = opts.find(r=>r.cel+'|'+r.ind===SEL.mon) || opts[0]; SEL.mon = cur.cel+'|'+cur.ind;
  const cumul = (arr, stopAtLast) => { if(cur.agg!=='Soma') return arr.slice();
    const last = arr.map((v,i)=>v!=null?i:-1).filter(i=>i>=0).pop(); if(last==null) return arr.map(()=>null);
    let s=0; return arr.map((v,i)=>{ s+= v||0; return (stopAtLast && i>last) ? null : s; }); };
  const pv = cumul(cur.prev,false), rv = cumul(cur.real,true);
  const series = [{name: cur.agg==='Soma'?'Previsto acumulado':'Previsto', vals:pv, color:'var(--series-1)', connect:true},
                  {name: cur.agg==='Soma'?'Realizado acumulado':'Realizado', vals:rv, color:'var(--series-2)', connect:true}];
  const mk = D.marcos.map((m,k)=>({m:m.data.getMonth()+1, frac:m.data.getDate()/31, label:'M'+(k+1)}));
  const sel = `<select id="selmon">${opts.map(r=>`<option value="${esc(r.cel+'|'+r.ind)}" ${r===cur?'selected':''}>${esc((CEL==='Todas'?r.cel+' · ':'')+r.ind)}</option>`).join('')}</select>`;
  const tbl = `<table><thead><tr><th></th>${MESES.map(m=>`<th class="n">${m}</th>`).join('')}<th class="n">Ano</th></tr></thead><tbody>
    <tr><td>Previsto</td>${cur.prev.map(v=>`<td class="n">${fv(v,cur.unidade)}</td>`).join('')}<td class="n"><b>${fv(acum(cur.prev,12,cur.agg),cur.unidade)}</b></td></tr>
    <tr><td>Realizado</td>${cur.real.map(v=>`<td class="n">${fv(v,cur.unidade)}</td>`).join('')}<td class="n"><b>${fv(acum(cur.real,12,cur.agg),cur.unidade)}</b></td></tr></tbody></table>`;
  return `<h2>Monitoramento mensal dos indicadores</h2>
  <p class="lead">Previsto e realizado mês a mês, lançados na aba Monitoramento_Mensal. Nos indicadores de quantidade a curva é acumulada; nos de % é o valor do mês. As linhas tracejadas marcam os marcos críticos.</p>
  <div class="card"><div class="row"><label>Indicador</label>${sel}<span class="tag">${esc(cur.agg)}</span><span class="tag">unidade: ${esc(cur.unidade)}</span></div>
  ${legend([{name:series[0].name,color:'var(--series-1)'},{name:series[1].name,color:'var(--series-2)'},{name:'Meta anual',color:'#191919',dash:true},{name:'Marco crítico',color:'#f4a300',dash:true}])}
  ${lineChart({series, ref:{value:cur.meta,label:'Meta anual'}, markers:mk, unit:cur.unidade})}
  ${cur.obs?`<p class="hint" style="margin-top:8px">📝 ${esc(cur.obs)}</p>`:''}
  <div class="scroll" style="margin-top:8px">${tbl}</div></div>`;
}

function pageMetas(){
  const metas = byCel(D.Metas);
  const bullets = metas.map(m=>{
    const ref = num(m['Meta de referência']) ?? num(m['Meta 2026']); const pv = num(m['Previsto pela carteira'])||0;
    const mx = niceMax(Math.max(ref||0,pv)*1.1); const W=520;
    const gap = ref!=null ? pv-ref : null; const pct = ref? pv/ref : null;
    const st = ref==null? null : pv===0 ? ['st-ser','–','Sem previsão'] : pv>=ref ? ['st-ok','✓','Cobre a meta'] : ['st-crit','✕','Abaixo da meta'];
    return `<tr><td><b>${esc(m['ID_Meta'])}</b> · ${esc(m['Meta mobilizadora'])}<br><span class="tag">${esc(m['Célula'])}</span>${m['Indicador oficial (Sebrae-SP)']?`<span class="tag">${esc(m['Indicador oficial (Sebrae-SP)'])}</span>`:''}</td>
      <td style="min-width:280px"><svg viewBox="0 0 ${W} 34" width="100%"><rect x="0" y="9" width="${W}" height="16" rx="4" fill="var(--grid)"/>
      <rect x="0" y="9" width="${W*pv/mx}" height="16" rx="4" fill="var(--series-1)" data-tip="Previsto pela carteira: ${nf.format(pv)}"/>
      ${ref!=null?`<line x1="${W*ref/mx}" x2="${W*ref/mx}" y1="2" y2="32" stroke="var(--text-primary)" stroke-width="3" data-tip="Meta de referência: ${nf.format(ref)}"/>`:''}</svg></td>
      <td class="n">${ref!=null?nf.format(ref):'—'}</td><td class="n">${nf.format(pv)}</td>
      <td class="n">${gap!=null?(gap>=0?'+':'')+nf.format(gap):'—'}${pct!=null&&pv?`<br><span style="color:var(--text-secondary);font-size:11px">${pf.format(pct)} da meta</span>`:''}</td>
      <td class="c">${st?chip(st[0],st[1],st[2]):''}</td></tr>`; }).join('');
  let chart = '';
  if(metas.length){
    let cur = metas.find(m=>m['ID_Meta']===SEL.meta) || metas[0]; SEL.meta = cur['ID_Meta'];
    const pr = D.Previsao_Mensal.filter(r=>r['ID_Meta']===cur['ID_Meta']);
    const mon = MESES.map(m=>{ const v = pr.map(r=>num(r[m])).filter(x=>x!=null); return v.length? v.reduce((a,b)=>a+b,0) : null; });
    let s=0; const cum = mon.some(v=>v!=null) ? mon.map(v=>(s+=v||0)) : mon;
    const ref = num(cur['Meta de referência']) ?? num(cur['Meta 2026']);
    const pico = mon.reduce((a,v,i)=>v!=null&&(a==null||v>mon[a])?i:a,null);
    chart = `<div class="card"><h3>Previsão mensal da carteira</h3><p class="hint">Soma acumulada da aba Previsao_Mensal contra a meta de referência.</p>
    <div class="row"><label>Meta</label><select id="selmeta">${metas.map(m=>`<option value="${esc(m['ID_Meta'])}" ${m===cur?'selected':''}>${esc(m['ID_Meta']+' · '+m['Meta mobilizadora']+' ('+m['Célula']+')')}</option>`).join('')}</select></div>
    ${legend([{name:'Previsto acumulado',color:'var(--series-1)'},{name:'Meta de referência',color:'#191919',dash:true}])}
    ${lineChart({series:[{name:'Previsto acumulado',vals:cum,color:'var(--series-1)',connect:true}], ref:{value:ref,label:'Meta'}, unit:'', height:260})}
    ${pico!=null && cum[11]?`<p class="hint">Mês de maior concentração: <b>${MESES[pico]}</b> (${nf.format(mon[pico])}, ${pf.format(mon[pico]/cum[11])} do total previsto).</p>`:''}</div>`;
  }
  return `<h2>Metas × carteira</h2><p class="lead">Quanto a carteira prevista entrega de cada meta registrada na aba Metas (metas de 2026 como referência até chegarem as de 2027).</p>
  <div class="card"><h3>Meta de referência × previsto pela carteira</h3>${legend([{name:'Previsto pela carteira',color:'var(--series-1)'},{name:'Meta de referência',color:'#191919'}])}
  ${metas.length?`<table><thead><tr><th>Meta</th><th></th><th class="n">Meta ref.</th><th class="n">Previsto</th><th class="n">Gap</th><th class="c">Situação</th></tr></thead><tbody>${bullets}</tbody></table>`:'<div class="empty">Nenhuma meta registrada para este filtro.</div>'}</div>${chart}`;
}

function pageCart(){
  const proj = byCel(D.Carteira);
  const cels = [...new Set(proj.map(r=>r['Célula']))];
  const W=860, ml=300, mr=20, rowH=26; let y=24, g='';
  const iw=W-ml-mr, x=i=>ml+iw*(i+0.5)/12;
  MESES.forEach((m,i)=>{ g+=`<text x="${x(i)}" y="14" text-anchor="middle" class="ax">${m}</text><line x1="${ml+iw*i/12}" x2="${ml+iw*i/12}" y1="18" y2="9999" stroke="var(--grid)"/>`; });
  cels.forEach(c=>{ g+=`<text x="4" y="${y+14}" font-weight="700" font-size="12.5" fill="var(--text-primary)">${esc(c)}</text>`; y+=rowH;
    proj.filter(r=>r['Célula']===c).forEach(r=>{ const d=parseD(r['Data de lançamento']); const nm=r['Projeto / Ação']||'';
      g+=`<text x="14" y="${y+13}" font-size="12" fill="var(--text-secondary)">${esc(nm.length>44?nm.slice(0,43)+'…':nm)}</text>`;
      const espc = r['Classificação']==='Especial'||r['Elegível a Projeto Especial?']==='Sim';
      if(d && d.getFullYear()===2027){ const i=d.getMonth(); g+=`<circle cx="${x(i)}" cy="${y+9}" r="${espc?7:5.5}" fill="${espc?'var(--series-2)':'var(--series-1)'}" stroke="var(--surface-1)" stroke-width="2" data-tip="<b>${esc(nm)}</b>\nLançamento: ${fmtMY(r['Data de lançamento'])}\nClassificação: ${esc(r['Classificação']||'não informada')}${espc?'\nProjeto especial / elegível':''}"/>`; }
      else g+=`<text x="${ml+4}" y="${y+13}" font-size="11.5" fill="var(--critical)">sem data de lançamento</text>`;
      y+=rowH; }); y+=6; });
  const tl = proj.length? `<svg viewBox="0 0 ${W} ${y}" width="100%"><style>.ax{fill:var(--text-secondary);font-size:11px}</style>${g.replace(/y2="9999"/g,`y2="${y}"`)}</svg>`:'<div class="empty">Sem projetos.</div>';
  const classes = ['Fomento','Inovação','Desenvolvimento Territorial','Especial'];
  const cl = cels.map(c=>{ const p=proj.filter(r=>r['Célula']===c); return `<tr><td>${esc(c)}</td>${classes.map(k=>`<td class="n">${p.filter(r=>r['Classificação']===k).length||'·'}</td>`).join('')}<td class="n">${p.filter(r=>!has(r['Classificação'])).length||'·'}</td><td class="n"><b>${p.length}</b></td></tr>`; }).join('');
  const ac = byCel(D.Acoes_Jornada);
  const tipos = ['Mercado','Vendas','Inovação','Captação de clientes','Relacionamento / pós-venda'];
  const etapas = ['Atração','Captação','Venda','Entrega','Acompanhamento de resultado'];
  const cnt = (t,e)=>ac.filter(r=>r['Tipo de ação']===t&&r['Etapa da jornada']===e);
  const mx = Math.max(1,...tipos.flatMap(t=>etapas.map(e=>cnt(t,e).length)));
  const seq = ['#ffffff','var(--seq-100)','var(--seq-200)','var(--seq-300)','var(--seq-400)','var(--seq-500)','var(--seq-600)'];
  const hm = tipos.map(t=>`<tr><td><b>${esc(t)}</b></td>${etapas.map(e=>{ const l=cnt(t,e); const k = l.length? Math.min(6,1+Math.floor(5*l.length/mx)) : 0;
     return `<td class="c" style="background:${seq[k]};color:${k>=4?'#fff':'var(--text-primary)'};font-weight:600;border:2px solid var(--surface-1)" data-tip="${esc(t+' · '+e)}\n${l.map(r=>'• '+esc(r['Descrição da ação'])+' ('+esc(r['Célula'])+')').join('\n')||'Nenhuma ação'}">${l.length||''}</td>`; }).join('')}<td class="n"><b>${ac.filter(r=>r['Tipo de ação']===t).length}</b></td></tr>`).join('');
  return `<h2>Carteira & jornada</h2><p class="lead">Calendário de lançamentos, classificação dos projetos e onde estão as ações de mercado, vendas e inovação na jornada do cliente.</p>
  <div class="card"><h3>Calendário de lançamentos 2027</h3>${legend([{name:'Projeto',color:'var(--series-1)',dot:true},{name:'Projeto especial / elegível',color:'var(--series-2)',dot:true}])}${tl}</div>
  <div class="grid2"><div class="card"><h3>Classificação dos projetos</h3><p class="hint">“Sem classif.” indica projetos ainda não classificados.</p>
  <table><thead><tr><th>Célula</th>${classes.map(k=>`<th class="n">${k}</th>`).join('')}<th class="n">Sem classif.</th><th class="n">Total</th></tr></thead><tbody>${cl||'<tr><td colspan="7" class="empty">Sem projetos</td></tr>'}</tbody></table></div>
  <div class="card"><h3>Ações por tipo × etapa da jornada</h3><p class="hint">Quanto mais escuro, mais ações. Passe o mouse para ver quais são.</p>
  <table><thead><tr><th></th>${etapas.map(e=>`<th class="c">${e}</th>`).join('')}<th class="n">Total</th></tr></thead><tbody>${hm}</tbody></table></div></div>`;
}

function pageCon(){
  const con = D.Conexoes;
  const TIP = ['Projeto conjunto','Público em comum','Parceiro em comum','Apoio técnico','Sobreposição a resolver'];
  const COL = ['var(--series-1)','var(--series-2)','var(--series-3)','var(--series-4)','var(--series-5)'];
  const W=720,H=540,cx=W/2,cy=H/2,R=185;
  const pos = {}; D.celulas.forEach((c,i)=>{ const a=-Math.PI/2+2*Math.PI*i/D.celulas.length; pos[c]=[cx+R*Math.cos(a), cy+R*Math.sin(a), a]; });
  const pairCount = {}; let g='';
  con.forEach(r=>{ const a=r['Célula de origem'], b=r['Célula conectada']; if(!pos[a]||!pos[b]) return;
    const key=[a,b].sort().join('|'); const n=pairCount[key]=(pairCount[key]||0)+1;
    const [x1,y1]=pos[a],[x2,y2]=pos[b]; const mx=(x1+x2)/2, my=(y1+y2)/2; const off=(n-1)*28 - 0;
    const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1; let nx=-dy/L, ny=dx/L; if(nx*(cx-mx)+ny*(cy-my)<0){nx=-nx;ny=-ny;} const qx=mx + nx*(30+off), qy=my + ny*(30+off);
    const k=TIP.indexOf(r['Tipo de sinergia']); const col = COL[k<0?0:k];
    const dim = CEL!=='Todas' && a!==CEL && b!==CEL;
    g+=`<path d="M${x1} ${y1} Q${qx} ${qy} ${x2} ${y2}" fill="none" stroke="${col}" stroke-width="3" opacity="${dim?0.12:0.9}" ${r['Tipo de sinergia']==='Sobreposição a resolver'?'stroke-dasharray="7 4"':''}/>`;
    g+=`<path d="M${x1} ${y1} Q${qx} ${qy} ${x2} ${y2}" fill="none" stroke="transparent" stroke-width="14" data-tip="<b>${esc(a)} → ${esc(b)}</b>\n${esc(r['Tipo de sinergia']||'')}\n${esc(r['Tema / Descrição']||'')}${r['Encaminhamento']?'\nEncaminhamento: '+esc(r['Encaminhamento']):''}"/>`;
  });
  D.celulas.forEach(c=>{ const [x,y,a]=pos[c]; const n=con.filter(r=>r['Célula de origem']===c||r['Célula conectada']===c).length; const dim = CEL!=='Todas'&&c!==CEL;
    g+=`<circle cx="${x}" cy="${y}" r="${12+Math.min(n,8)*2}" fill="${n?'var(--brand)':'#c9d1dc'}" stroke="var(--surface-1)" stroke-width="3" opacity="${dim?0.35:1}" data-tip="<b>${esc(c)}</b>\n${n} conexão(ões)"/>`;
    const lx=cx+(R+38)*Math.cos(a), ly=cy+(R+30)*Math.sin(a); const anc = Math.cos(a)>0.3?'start':Math.cos(a)<-0.3?'end':'middle';
    g+=`<text x="${lx}" y="${ly+4}" text-anchor="${anc}" font-size="12.5" font-weight="${dim?400:600}" fill="${dim?'var(--text-muted)':'var(--text-primary)'}">${esc(c)}</text>`; });
  const rows = byCel(con).concat(CEL==='Todas'?[]:con.filter(r=>r['Célula conectada']===CEL)).map(r=>`<tr><td>${esc(r['Célula de origem'])}</td><td>${esc(r['Célula conectada'])}</td><td>${esc(r['ID_Projeto']||'')}</td><td>${esc(r['Tema / Descrição'])}</td><td>${esc(r['Tipo de sinergia'])}</td><td>${esc(r['Encaminhamento']||'')}</td></tr>`).join('');
  return `<h2>Conexões entre células</h2><p class="lead">Quem precisa de quem para entregar. Linhas tracejadas são sobreposições a resolver. Células em cinza ainda não têm conexões registradas.</p>
  <div class="grid2"><div class="card"><h3>Mapa de integração do ER</h3>${legend(TIP.map((t,i)=>({name:t,color:COL[i]})))}<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg></div>
  <div class="card"><h3>Lista de conexões</h3><div class="scroll"><table><thead><tr><th>Origem</th><th>Conectada</th><th>Projeto</th><th>Tema</th><th>Tipo</th><th>Encaminhamento</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">Nenhuma conexão</td></tr>'}</tbody></table></div></div></div>`;
}

function pageAval(){
  const av = byCel(D.Avaliacoes);
  const cards = av.map(a=>{ const notas = ['Coerência projetos × metas','Aprendizados 2026 aplicados','Inovação / novas soluções','Capacidade realista','Parcerias','Clareza do Projeto Especial'];
    const ns = notas.map(n=>[n,num(a[n])]).filter(x=>x[1]!=null);
    return `<div class="card"><h3>${esc(a['Célula'])}</h3><p class="hint">${esc(a['Etapa']||'')} · ${fmtD(a['Data'])} · ${esc(a['Avaliador']||'')}</p>
    ${ns.length? `<div class="row">${ns.map(([n,v])=>`<span class="tag">${esc(n)}: <b>${v}</b></span>`).join('')}</div>` : '<span class="tag">Notas ainda não atribuídas</span>'}
    <h4>Pontos fortes</h4><p>${esc(a['Pontos fortes']||'—')}</p><h4>Pontos a aprofundar</h4><p>${esc(a['Pontos a aprofundar']||'—')}</p>
    <h4>Legado 2027</h4><p>${esc(a['Legado 2027 (uma frase)']||'— ainda não definido')}</p><h4>Encaminhamentos</h4><p>${esc(a['Encaminhamentos']||'—')}</p></div>`; }).join('');
  const rk = byCel(D.Riscos).map(r=>{ const c=num(r['Criticidade']); const st = c==null? ['st-neu','–','Não avaliado'] : c>=6? ['st-crit','✕','Alto ('+c+')'] : c>=3? ['st-warn','!','Médio ('+c+')'] : ['st-ok','✓','Baixo ('+c+')'];
    return `<tr><td>${esc(r['Célula'])}</td><td>${esc(r['ID_Projeto']||'')}</td><td>${esc(r['Risco / Dependência'])}</td><td class="c">${chip(st[0],st[1],st[2])}</td><td>${esc(r['Mitigação']||'')}</td></tr>`; }).join('');
  const ml = byCel(D.Melhorias).map(r=>`<tr><td>${esc(r['Célula'])}</td><td>${esc(r['Melhoria proposta'])}</td><td>${esc(r['Aprendizado 2026']||'—')}</td><td>${esc(r['Ação concreta']||'—')}</td><td>${esc(r['Responsável']||'—')}</td></tr>`).join('');
  return `<h2>Pré-leitura, riscos e melhorias</h2><p class="lead">Fichas de avaliação da Gerência/LOR, riscos e melhorias propostas pelas células.</p>
  <div class="eval">${cards||'<div class="empty">Nenhuma avaliação registrada.</div>'}</div>
  <div class="grid2"><div class="card"><h3>Riscos e dependências</h3><table><thead><tr><th>Célula</th><th>Projeto</th><th>Risco</th><th class="c">Criticidade</th><th>Mitigação</th></tr></thead><tbody>${rk||'<tr><td colspan="5" class="empty">Nenhum risco registrado</td></tr>'}</tbody></table></div>
  <div class="card"><h3>Melhorias propostas</h3><table><thead><tr><th>Célula</th><th>Melhoria</th><th>Aprendizado 2026</th><th>Ação</th><th>Resp.</th></tr></thead><tbody>${ml||'<tr><td colspan="5" class="empty">Nenhuma melhoria registrada</td></tr>'}</tbody></table></div></div>`;
}

/* ---------------- shell ---------------- */
function render(){
  const f = {comp:pageComp, marcos:pageMarcos, mon:pageMon, metas:pageMetas, cart:pageCart, con:pageCon, aval:pageAval}[PAGE];
  document.getElementById('main').innerHTML = f();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.p===PAGE));
  const sm=document.getElementById('selmon'); if(sm) sm.onchange=e=>{SEL.mon=e.target.value; render();};
  const sme=document.getElementById('selmeta'); if(sme) sme.onchange=e=>{SEL.meta=e.target.value; render();};
  document.querySelectorAll('tr[data-cel]').forEach(tr=>tr.onclick=()=>{ CEL=tr.dataset.cel; document.getElementById('fcel').value=CEL; render(); });
}
function boot(raw){
  D = prepare(raw);
  const fc = document.getElementById('fcel');
  fc.innerHTML = ['Todas',...D.celulas].map(c=>`<option ${c===CEL?'selected':''}>${esc(c)}</option>`).join('');
  if(CEL!=='Todas' && !D.celulas.includes(CEL)) CEL='Todas';
  document.getElementById('fonte').textContent = `Fonte: ${D._fonte} · BI atualizado em ${new Date().toLocaleString('pt-BR')}`;
  render();
}
document.getElementById('nav').innerHTML = PAGES.map(([k,l])=>`<button data-p="${k}">${l}</button>`).join('');
document.getElementById('nav').onclick = e=>{ const b=e.target.closest('button'); if(b){ PAGE=b.dataset.p; render(); } };
document.getElementById('fcel').onchange = e=>{ CEL=e.target.value; render(); };

/* ---------------- upload xlsx (SheetJS via CDN) ---------------- */
function loadSheetJS(){ return new Promise((ok,err)=>{ if(window.XLSX) return ok(); const s=document.createElement('script');
  s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js'; s.onload=ok; s.onerror=()=>err(new Error('Não foi possível carregar o leitor de Excel (precisa de internet).')); document.head.appendChild(s); }); }
const iso = v => v instanceof Date ? `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}` : v;
document.getElementById('file').onchange = async e=>{
  const f = e.target.files[0]; if(!f) return;
  try{
    await loadSheetJS();
    const wb = XLSX.read(await f.arrayBuffer(), {cellDates:true});
    const out = {};
    const SHEETS = ["Carteira","Acoes_Jornada","Metas","Monitoramento_Mensal","Marcos_Criticos","Previsao_Mensal","Melhorias","Parceiros","Conexoes","Riscos","Avaliacoes","Marcos"];
    for(const s of SHEETS){
      const ws = wb.Sheets[s]; if(!ws){ out[s]=[]; continue; }
      const arr = XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
      const hdr = arr[3]||[];
      out[s] = arr.slice(4).filter(r=>r && r.slice(0,3).some(v=>has(v))).map(r=>Object.fromEntries(hdr.map((h,i)=>[h, iso(r[i]===''?null:r[i])])));
    }
    const li = XLSX.utils.sheet_to_json(wb.Sheets['Listas'],{header:1,defval:null,raw:true});
    out._celulas = li.slice(4).map(r=>r[0]).filter(has);
    out._indicadores = li.slice(4).filter(r=>has(r[20])).map(r=>[r[20],r[21],r[22]]);
    out._marcos = li.slice(4,7).map(r=>[r[24], iso(r[25])]);
    out._fonte = f.name;
    boot(out);
  }catch(err){ alert('Erro ao ler a planilha: '+err.message); }
  e.target.value='';
};
boot(RAW);
</script>
